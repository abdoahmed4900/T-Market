<aside class="sidebar relative z-[11] max-[1100px]:hidden" [class.w-[0px]]="!sidebarOpen()">

  <main #sidebarContent
    class="sidebar-content top-0 start-0 flex flex-col transition-all duration-500 fixed ease-[cubic-bezier(0.34,1.2,0.64,1)] gap-6 min-h-full w-[300px] bg-gradient-to-br from-purple-900 via-purple-800 to-indigo-900 backdrop-blur-sm shadow-2xl shadow-purple-500/20 border-r border-purple-400/30">

    <!-- Animated gradient overlay -->
    <div
      class="absolute inset-0 bg-gradient-to-br from-purple-500/10 via-transparent to-indigo-500/10 pointer-events-none">
    </div>

    <!-- Decorative elements -->
    <div class="absolute top-20 -right-10 w-40 h-40 bg-purple-400/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-20 -left-10 w-40 h-40 bg-indigo-400/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header with logo/brand -->
    <div class="relative px-6 pt-6 pb-2 border-b border-purple-400/20">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 bg-gradient-to-br from-purple-400 to-indigo-500 rounded-lg rotate-45"></div>
          <span
            class="text-white font-bold text-xl bg-gradient-to-r from-purple-200 to-white bg-clip-text text-transparent">T-Market</span>
        </div>
        <button
          class="menu-btn text-white/70 hover:text-white hover:rotate-90 transition-all duration-300 text-2xl p-2 rounded-lg hover:bg-white/10"
          (click)="toggleSidebar()">
          ✕
        </button>
      </div>
    </div>

    <!-- Navigation with icons and hover effects -->
    <nav class="relative flex px-4 flex-col gap-2">
      @for (item of menu(); track $index) {
      <a (click)="goToRoute(item.path)"
        class="group cursor-pointer flex items-center gap-4 px-4 py-3 rounded-xl text-purple-100 hover:text-white transition-all duration-300 hover:bg-gradient-to-r hover:from-purple-600/50 hover:to-indigo-600/50 hover:translate-x-2 hover:shadow-lg">

        <!-- Icon with emoji or FontAwesome -->
        @if (item.icon) {
        @if (typeof item.icon === 'string' && item.icon.length <= 2) { <!-- Emoji icon -->
          <span class="text-xl group-hover:scale-110 transition-transform">{{ item.icon }}</span>
          } @else {
          <!-- FontAwesome icon -->
          <fa-icon [icon]="item.icon"
            class="text-purple-300 group-hover:text-purple-200 transition-colors w-5"></fa-icon>
          }
          }

          <span class="font-medium">{{ item.label | translate }}</span>

          <div class="ml-auto opacity-0 group-hover:opacity-100 transition-opacity">
            <span class="text-purple-300 text-sm">→</span>
          </div>
      </a>
      }
    </nav>

    <!-- Divider with gradient -->
    <div class="relative h-px bg-gradient-to-r from-transparent via-purple-400/50 to-transparent mx-6"></div>

    <!-- Language & Theme section with modern design -->
    <section class="relative flex px-6 flex-row gap-3 items-center justify-center">
      <button
        class="group relative overflow-hidden rounded-xl border border-purple-400/30 hover:border-purple-300 bg-purple-800/30 backdrop-blur-sm hover:bg-purple-700/50 transition-all duration-300 text-[12px] py-2.5 px-3.5"
        (click)="changeTheme()">
        <fa-icon class="text-lg text-purple-200 group-hover:text-white transition-colors relative z-10"
          [icon]="themeIcon()"></fa-icon>
        <div
          class="absolute inset-0 bg-gradient-to-r from-purple-500 to-indigo-500 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
        </div>
      </button>

      <button
        class="relative overflow-hidden rounded-xl border border-purple-400/30 hover:border-purple-300 bg-purple-800/30 backdrop-blur-sm hover:bg-purple-700/50 transition-all duration-300 text-[12px] font-semibold text-purple-100 hover:text-white py-2.5 px-5"
        (click)="changeLanguage('en')">EN</button>

      <button
        class="relative overflow-hidden rounded-xl border border-purple-400/30 hover:border-purple-300 bg-purple-800/30 backdrop-blur-sm hover:bg-purple-700/50 transition-all duration-300 text-[12px] font-semibold text-purple-100 hover:text-white py-2.5 px-5"
        (click)="changeLanguage('ar')">عربي</button>
    </section>

    <!-- Logout button with modern design -->
    <div class="relative px-6 pb-6 mt-auto">
      <button
        class="group relative overflow-hidden rounded-xl bg-gradient-to-r from-red-500/80 to-red-600/80 hover:from-red-500 hover:to-red-600 transition-all duration-300 text-[14px] font-semibold h-fit w-full py-3 shadow-lg shadow-red-500/20 hover:shadow-red-500/30 transform hover:scale-[1.02] active:scale-[0.98]"
        (click)="logout()">
        <span class="relative z-10 flex items-center justify-center gap-2 text-white">
          <fa-icon [icon]="logoutIcon" class="text-sm"></fa-icon>
          {{'NAVBAR.SIGN_OUT' | translate}}
        </span>
        <div
          class="absolute inset-0 bg-gradient-to-r from-red-600 to-red-700 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
        </div>
      </button>
    </div>

  </main>

  <!-- Hamburger button with animation -->
  @if(!sidebarOpen()){
  <button
    class="fixed top-6 start-6 z-50 menu-btn text-white text-2xl w-12 h-12 rounded-xl bg-gradient-to-br from-purple-600 to-indigo-600 shadow-lg shadow-purple-500/30 hover:shadow-xl hover:shadow-purple-500/40 hover:scale-105 transition-all duration-300 flex items-center justify-center backdrop-blur-sm"
    (click)="toggleSidebar()">
    <div class="flex flex-col gap-1.5 w-5">
      <span class="w-5 h-0.5 bg-white rounded-full"></span>
      <span class="w-5 h-0.5 bg-white rounded-full"></span>
      <span class="w-3 h-0.5 bg-white rounded-full"></span>
    </div>
  </button>
  }

</aside>
