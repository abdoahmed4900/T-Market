@let p = (product | async)!;

@if (isLoaded()) {
<section appAnimateOnScroll [once]="false" class="group cursor-pointer cart-card flex items-start rounded-2xl border gap-4 flex-col lg:flex-row justify-between relative 
                  transition-all duration-300 ease-in-out hover:shadow-xl hover:shadow-purple-500/10
                  border-purple-100/50 dark:border-purple-800/30
                  overflow-hidden animate-fade-in">

  <!-- Hover glow effect -->
  <div class="absolute inset-0 bg-gradient-to-r from-purple-500/0 via-purple-500/0 to-indigo-500/0 
                group-hover:from-purple-500/5 group-hover:to-indigo-500/5 transition-all duration-700"></div>

  @if (p.isDeleted) {
  <app-deleted-product-overlay></app-deleted-product-overlay>
  }

  <!-- Product Image -->
  <div class="relative overflow-hidden rounded-xl m-4 cursor-pointer group/image" [routerLink]="['/product', p.id]">
    <img [src]="p!.imageUrls![0]" alt="product-image" class="rounded-xl p-2 md:h-[250px] h-[300px] lg:w-[250px] w-full object-cover 
                  transition-transform duration-500 group-hover/image:scale-105">
    <div
      class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent opacity-0 group-hover/image:opacity-100 transition-opacity duration-300 rounded-xl">
    </div>
  </div>

  <!-- Product Details -->
  <div class="details flex flex-col justify-between w-full flex-wrap gap-4 p-6 items-start">

    <!-- Card Text Section -->
    <section class="card-text flex flex-col items-start gap-3 w-full">
      <h2 class="text-xl md:text-2xl font-bold 
                   group-hover:text-purple-600 dark:group-hover:text-purple-400 transition-colors duration-300
                   cursor-pointer">
        {{p!.name}}
      </h2>
      <p class="text-gray-600 dark:text-gray-300 line-clamp-2 leading-relaxed" [routerLink]="['/product', p.id]">
        {{p!.description}}
      </p>
    </section>

    <!-- Cart Actions Section -->
    <div class="cart-actions flex items-center flex-wrap gap-4 w-full mt-2">

      <!-- Remove Button -->
      <button class="group/btn relative overflow-hidden bg-red-500 hover:bg-red-700 
                       text-white rounded-xl px-6 py-3 font-semibold text-sm
                       transition-all duration-300 transform hover:scale-[1.02] active:scale-[0.98]
                       shadow-md hover:shadow-lg hover:shadow-red-500/30" (click)="removeFromCart()">

        <div
          class="absolute inset-0 -translate-x-full group-hover/btn:translate-x-full transition-transform duration-700 bg-gradient-to-r from-transparent via-white/30 to-transparent">
        </div>

        <span class="relative z-10 flex items-center gap-2">
          <fa-icon [icon]="deleteIcon" class="text-sm"></fa-icon>
          {{'CART.DELETE' | translate}}
        </span>
      </button>

      <!-- Quantity Controls -->
      <div class="flex items-center gap-3 bg-gray-100 dark:bg-gray-700 rounded-xl p-1">
        <button class="w-10 h-10 rounded-lg bg-gradient-to-r from-purple-600 to-indigo-600
                         hover:from-purple-700 hover:to-indigo-700
                         text-white font-bold text-lg
                         transition-all duration-200 transform hover:scale-105 active:scale-95
                         flex items-center justify-center" (click)="decreaseQuantity()">
          -
        </button>

        <p class="font-semibold text-lg text-gray-800 dark:text-white min-w-[40px] text-center">
          {{quantity()}}
        </p>

        <button class="w-10 h-10 rounded-lg bg-gradient-to-r from-purple-600 to-indigo-600
                         hover:from-purple-700 hover:to-indigo-700
                         text-white font-bold text-lg
                         transition-all duration-200 transform hover:scale-105 active:scale-95
                         flex items-center justify-center" (click)="increaseQuantity()">
          +
        </button>
      </div>

      <!-- Price Section -->
      <div class="price-section flex flex-row items-center ms-auto">
        <div class="text-end">
          <p class="text-xs text-gray-500 dark:text-gray-400">{{'CART.SUBTOTAL' | translate}}</p>
          <p class="font-bold text-2xl bg-gradient-to-r from-purple-600 to-indigo-600 bg-clip-text text-transparent">
            {{(quantity() * p!.price) | currency}}
          </p>
        </div>
      </div>

    </div>

  </div>

  <!-- Decorative corner -->
  <div class="absolute top-0 end-0 w-16 h-16 overflow-hidden pointer-events-none">
    <div class="absolute top-0 end-0 w-8 h-8 bg-gradient-to-bl from-purple-400/20 to-transparent 
                  transform rotate-45 translate-x-4 -translate-y-4"></div>
  </div>

</section>
}@else {
<section class="cart-card px-3 pt-1 flex items-start rounded-xl border gap-4 flex-col lg:flex-row justify-between">
  <div class="rounded-4xl p-4 md:h-[250px] h-70 lg:w-70 w-full skeleton-basic"></div>
  <section class="details flex flex-col justify-between w-full flex-wrap gap-4 p-4 items-start">
    <div class="card-text flex flex-col items-start gap-4">
      <div class="small-text-skeleton skeleton-basic"></div>
      <div class="text-skeleton skeleton-basic"></div>
      <div class="cart-actions flex items-center flex-row gap-3 flex-wrap w-full">
        <div class="text-skeleton skeleton-basic"></div>
        <div class="small-text-skeleton skeleton-basic"></div>
        <div class="small-text-skeleton skeleton-basic"></div>
        <div class="small-text-skeleton skeleton-basic"></div>
        <div class="small-text-skeleton skeleton-basic"></div>
      </div>
    </div>
  </section>
</section>
}
