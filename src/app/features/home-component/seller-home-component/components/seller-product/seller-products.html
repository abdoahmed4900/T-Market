<section class="grid gap-4 grid-cols-1">
  @if (isLoaded()) {
  @for (item of showedProducts(); track item.id;) {
  <div class="relative">
    @if (item.isDeleted) {
    <app-deleted-product-overlay></app-deleted-product-overlay>
    }
    <div appAnimateOnScroll
      class="flex border rounded-xl p-4 lg:flex-row flex-col relative flex-grow justify-between items-center slideFromLeftAnimation">
      <app-dashboard-product class="self-start w-full" [product]="item"></app-dashboard-product>
      <section class="actions-row flex flex-row flex-wrap justify-center gap-4">
        <button type="button" class="group/btn size-fit relative overflow-hidden px-5 py-2.5 rounded-xl
                                   bg-gradient-to-r from-purple-600 to-indigo-600
                                   hover:from-purple-700 hover:to-indigo-700
                                   transform hover:scale-[1.02] active:scale-[0.98]
                                   transition-all duration-300
                                   shadow-md hover:shadow-lg hover:shadow-purple-500/30
                                   text-white font-semibold text-sm
                                   flex items-center gap-2" [routerLink]="['/update-product/', item.id]">

          <div
            class="absolute inset-0 -translate-x-full group-hover/btn:translate-x-full transition-transform duration-700 bg-gradient-to-r from-transparent via-white/30 to-transparent">
          </div>

          <span class="relative z-10 flex items-center gap-2">
            <fa-icon [icon]="editIcon" class="text-sm"></fa-icon>
            {{'SIDEBAR.UPDATE_PRODUCT' | translate}}
          </span>
        </button>
        <button type="button" class="size-fit group/btn relative overflow-hidden px-5 py-2.5 rounded-xl transition-all duration-300
                           transform hover:scale-[1.02] active:scale-[0.98]
                           shadow-md hover:shadow-lg
                           text-white font-semibold text-sm
                           flex items-center gap-2  bg-gradient-to-r from-red-500 to-red-600
                           hover:from-red-600 hover:to-red-700
                           hover:shadow-red-500/30 p-4 group/btn self-center z-[11]"
          (click)="deleteOrUnDeleteProduct(item)">
          <span class="relative z-10 flex items-center gap-2">
            @if (!item.isDeleted) {
            <fa-icon [icon]="deleteIcon" class="text-sm"></fa-icon>
            {{'SIDEBAR.DELETE_PRODUCT' | translate}}
            } @else {
            <fa-icon [icon]="restoreIcon" class="text-sm"></fa-icon>
            {{'SIDEBAR.UNDELETE_PRODUCT' | translate}}
            }
          </span>
          <div
            class="absolute inset-0 -translate-x-full group-hover/btn:translate-x-full transition-transform duration-700 bg-gradient-to-r from-transparent via-white/30 to-transparent">
          </div>
        </button>
      </section>
    </div>
  </div>
  }
  <app-pagination-container></app-pagination-container>
  }@else{
  @for (item of [1,2,3]; track $index) {
  <div class="flex border rounded-xl p-4 flex-row flex-wrap flex-grow justify-between">
    <div class="flex flex-col gap-3 seller-products">
      <div class="skeleton-basic w-[250px] h-[20px]"></div>
      <div class="skeleton-basic w-[100px] h-[20px]"></div>
      <div class="skeleton-basic w-[150px] h-[20px]"></div>
      <div class="skeleton-basic w-[120px] h-[20px]"></div>
    </div>
    <section class="actions-row flex flex-row gap-4 flex-wrap">
      <div class="skeleton-basic w-[120px] h-[40px]"></div>
      <div class="skeleton-basic w-[120px] h-[40px]"></div>
    </section>
  </div>
  }
  }
</section>
