<section appAnimateOnScroll [once]="false" class="group relative overflow-hidden rounded-2xl p-6 transition-all duration-500 hover:shadow-2xl hover:shadow-purple-500/20 hover:-translate-y-1  animate-fade-in-up
                bg-gradient-to-br from-white to-purple-50/30 dark:from-gray-800 dark:to-purple-900/20
                border border-purple-100/50 dark:border-purple-800/30">

  <!-- Animated gradient background -->
  <div
    class="absolute inset-0 bg-gradient-to-br from-purple-500/0 via-purple-500/0 to-indigo-500/0 group-hover:from-purple-500/5 group-hover:via-purple-500/0 group-hover:to-indigo-500/5 transition-all duration-700">
  </div>

  <!-- Decorative circle blobs -->
  <div
    class="absolute -top-20 -right-20 w-40 h-40 bg-purple-300/20 dark:bg-purple-600/10 rounded-full blur-3xl group-hover:scale-150 transition-transform duration-700">
  </div>
  <div
    class="absolute -bottom-20 -left-20 w-40 h-40 bg-indigo-300/20 dark:bg-indigo-600/10 rounded-full blur-3xl group-hover:scale-150 transition-transform duration-700 delay-100">
  </div>

  <!-- Subtle border shine effect -->
  <div
    class="absolute inset-0 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none">
    <div class="absolute -inset-px bg-gradient-to-r from-purple-500 via-transparent to-indigo-500 rounded-2xl blur-sm">
    </div>
  </div>

  @if(showCard()){
  <!-- Icon placeholder (optional - add an icon prop to customize) -->
  <div class="relative mb-4">
    <div
      class="w-12 h-12 rounded-xl bg-gradient-to-br from-purple-500 to-indigo-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
      <fa-icon [icon]="statisticIcon()" class="text-white text-xl"></fa-icon>
    </div>
  </div>

  <!-- Title with animated underline -->
  <div class="relative">
    <h2
      class="text-xl md:text-2xl font-bold bg-gradient-to-r from-purple-700 to-indigo-700 dark:from-purple-300 dark:to-indigo-300 bg-clip-text text-transparent">
      {{ statisticName() | translate }}
    </h2>
    <div
      class="absolute -bottom-2 left-0 w-0 group-hover:w-full h-0.5 bg-gradient-to-r from-purple-500 to-indigo-500 transition-all duration-500 rounded-full">
    </div>
  </div>

  <!-- Statistics number with counting animation -->
  <div class="relative mt-4">
    <p class="text-3xl md:text-4xl font-bold text-gray-800 dark:text-gray-100 flex items-baseline gap-1">
      <span class="statistic-number"></span>
      <span>{{statisticNumber()}}</span>
    </p>

    <!-- Decorative dash -->
    <div class="absolute -bottom-2 left-0 w-12 h-0.5 bg-purple-300 dark:bg-purple-600 rounded-full"></div>
  </div>

  } @else {
  <!-- Enhanced skeleton loader -->
  <div class="relative">
    <!-- Icon skeleton -->
    <div
      class="w-12 h-12 rounded-xl bg-gradient-to-br from-gray-200 to-gray-300 dark:from-gray-700 dark:to-gray-600 animate-pulse mb-4"
      appAnimateOnScroll [once]="false">
    </div>

    <!-- Title skeleton -->
    <div
      class="skeleton-basic w-32 h-6 rounded-lg bg-gradient-to-r from-gray-200 to-gray-300 dark:from-gray-700 dark:to-gray-600 animate-pulse mb-2"
      appAnimateOnScroll [once]="false">
    </div>

    <!-- Value skeleton -->
    <div
      class="skeleton-basic w-24 h-8 rounded-lg bg-gradient-to-r from-gray-200 to-gray-300 dark:from-gray-700 dark:to-gray-600 animate-pulse mt-4"
      appAnimateOnScroll [once]="false">
    </div>

  </div>
  }

</section>
