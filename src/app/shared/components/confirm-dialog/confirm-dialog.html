<div class="overlay">
  <div class="dialog relative my-3">
    <div class="flex justify-center">
      <div class="w-16 h-16 rounded-full bg-gradient-to-br from-purple-100 to-indigo-100 dark:from-purple-900/30 dark:to-indigo-900/30 
                        flex items-center justify-center shadow-inner">
        <fa-icon [icon]="getIcon()" class="text-3xl" [class.text-purple-500]="data.type !== 'danger'"
          [class.text-red-500]="data.type === 'danger'"></fa-icon>
      </div>
    </div>

    <!-- Title -->
    <h2 class="text-xl font-bold text-center text-gray-800 dark:text-gray-200">
      {{ data.title }}
    </h2>

    <p class="text-sm text-center text-gray-500 dark:text-gray-400">
      {{ data.message }}
    </p>

    <div class="actions flex flex-row gap-4">
      <button mat-button class="flex-1 rounded-xl bg-gray-100 dark:bg-gray-700 
                       text-gray-700 dark:text-gray-300 font-semibold text-sm
                       hover:bg-gray-200 dark:hover:bg-gray-600
                       transition-all duration-300" [mat-dialog-close]="false">
        {{ data.cancelText || ('COMMON.CANCEL' | translate) }}
      </button>
      <button mat-button class="flex-1 rounded-xl font-semibold text-sm
                             transition-all duration-300 shadow-md hover:shadow-lg
                             relative overflow-hidden group" [class.bg-gradient-to-r]="data.type !== 'danger'"
        [class.from-purple-600]="data.type !== 'danger'" [class.to-indigo-600]="data.type !== 'danger'"
        [class.hover:from-purple-700]="data.type !== 'danger'" [class.hover:to-indigo-700]="data.type !== 'danger'"
        [class.hover:shadow-purple-500]="data.type !== 'danger'" [class.bg-gradient-to-r]="data.type === 'danger'"
        [class.from-red-500]="data.type === 'danger'" [class.to-red-600]="data.type === 'danger'"
        [class.hover:from-red-600]="data.type === 'danger'" [class.hover:to-red-700]="data.type === 'danger'"
        [class.hover:shadow-red-500]="data.type === 'danger'" [class.text-white]="true" [mat-dialog-close]="true">

        <!-- Button shine effect -->
        <div class="absolute inset-0 -translate-x-full group-hover:translate-x-full transition-transform duration-700 
                            bg-gradient-to-r from-transparent via-white/30 to-transparent">
        </div>

        <span class="relative z-10">
          {{ data.confirmText || ('COMMON.CONFIRM' | translate) }}
        </span>
      </button>
    </div>
  </div>
</div>
